<style>
:root {
  --bg-dark: #061d25;
  --panel-bg: rgba(5, 39, 49, 0.78);
  --panel-border: rgba(157, 226, 224, 0.22);
  --text-main: #f2fbf9;
  --text-muted: #a5c8c7;
  --accent: #43c6bd;
  --accent-glow: rgba(67, 198, 189, 0.35);
  --radius-lg: 20px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-body: "SF Pro", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: var(--font-body);
}

/* Background Slideshow with 5px Blur; photos stay undimmed */
#bg-container {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.bg-slide {
  position: absolute;
  inset: -30px;
  background-size: cover;
  background-position: center;
  opacity: 0;
  filter: blur(5px);
  -webkit-filter: blur(5px);
  transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1), transform 12s cubic-bezier(0.25, 1, 0.5, 1);
  transform: scale(1);
}

.bg-slide.active {
  opacity: 1;
  transform: scale(1.06);
}

#bg-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* App Shell */
#app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(70px + env(safe-area-inset-bottom, 0px));
  max-width: 1200px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px;
  margin-bottom: auto;
}

.brand {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.brand span { color: var(--accent); }

.splash-tag {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
  background: rgba(255, 255, 255, 0.05);
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid var(--panel-border);
}

/* Views Container */
.view-panel {
  position: absolute;
  inset: 65px 12px 75px 12px;
  display: none;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.view-panel.active { display: flex; }

#view-home {
  background: none;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  align-items: center;
  justify-content: center;
}

.home-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  max-width: 600px;
  width: 100%;
  margin-bottom: 60px;
  padding: 0 10px;
}

.home-title {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -1px;
}

.home-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
}

/* Search Bar & Small Dropdown */
.search-container {
  display: flex;
  gap: 6px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-lg);
  padding: 6px;
  width: 100%;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  position: relative;
  backdrop-filter: blur(12px);
}

.engine-select { position: relative; }

.engine-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 0;
  color: var(--text-main);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  min-height: 40px;
}

.engine-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 160px;
  background: #10141D;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  padding: 4px;
  display: none;
  flex-direction: column;
  gap: 2px;
  z-index: 100;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

.engine-dropdown.open { display: flex; }

.engine-opt {
  background: none;
  border: 0;
  color: var(--text-main);
  padding: 10px;
  border-radius: 6px;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
}

.engine-opt:hover { background: rgba(255, 255, 255, 0.08); }

.search-input {
  flex: 1;
  background: none;
  border: 0;
  outline: 0;
  color: var(--text-main);
  font-size: 16px;
  padding: 0 8px;
  font-family: var(--font-body);
  min-height: 40px;
}

.search-input::placeholder { color: var(--text-muted); }

/* Grid & Cards for Apps/Games */
.section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}

.card {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: var(--radius-md);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background 0.2s, border-color 0.2s;
}

.card:active { background: rgba(255, 255, 255, 0.1); }

.card-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  background: rgba(0, 136, 168, 0.15);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 16px;
  font-weight: 700;
}

.card-name {
  font-size: 12px;
  font-weight: 500;
  text-align: center;
}

/* Settings Rows */
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.setting-row label { font-size: 13px; font-weight: 500; }
.setting-row select, .setting-row input[type="text"] {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  outline: 0;
  font-size: 13px;
}

/* Pro Browsing View */
#main-view {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: var(--bg-dark);
  display: none;
  flex-direction: column;
}
#main-view.active { display: flex; }

#browser-frame {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}

/* Collapsible Right-Hand Control Bar */
#right-sidebar {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  padding: 6px;
  border-radius: var(--radius-md);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
#right-sidebar.collapsed { transform: translateX(calc(100% + 20px)); }

.sidebar-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 0;
  color: var(--text-main);
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: grid;
  place-items: center;
  touch-action: manipulation;
}
.sidebar-btn:active { background: var(--accent); color: #fff; }
.sidebar-btn svg { width: 18px; height: 18px; fill: currentColor; }

/* Floating URL Toolbar with Pull-Out Arrow */
#url-toolbar {
  position: absolute;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  padding: 6px 10px;
  border-radius: 99px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  max-width: 92vw;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
#url-toolbar.collapsed { opacity: 0; transform: translateX(-50%) translateY(120px); pointer-events: none; }

.toolbar-btn { background: none; border: 0; color: var(--text-main); padding: 8px; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
.toolbar-btn svg { width: 16px; height: 16px; fill: currentColor; }
.url-display { font-size: 12px; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }

@media (min-width: 600px) {
  .url-display { max-width: 320px; }
}

/* Floating Panels */
.floating-panel {
  position: absolute;
  top: 50px;
  right: 12px;
  left: 12px;
  max-width: 420px;
  margin-left: auto;
  height: 450px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(16px);
  z-index: 30;
  display: none;
  flex-direction: column;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  overflow: hidden;
}
.floating-panel.open { display: flex; }
.panel-header { padding: 12px 16px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; }
.panel-close { background: none; border: 0; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 4px; }
.panel-body { flex: 1; padding: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; font-size: 12px; }

/* Persistent home taskbar; softly fades while a browser session is active. */
#dock {
  position: fixed !important;
  left: 50% !important;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important;
  z-index: 2147483000 !important;
  display: flex !important;
  gap: 3px;
  padding: 5px;
  background: rgba(14, 18, 26, 0.88);
  border: 1px solid var(--panel-border);
  border-radius: 99px;
  backdrop-filter: blur(14px);
  box-shadow: 0 12px 35px rgba(0,0,0,0.6);
  transform: translate3d(-50%, 0, 0) !important;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity .3s ease, background .3s ease;
}
/* Hard state switch: the home taskbar and its edge sensor do not exist visually while browsing. */
body.browsing #dock,
body.browsing #dock-edge-trigger {
  display: none !important;
}

.dock-item {
  background: none;
  border: 0;
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 99px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 5px;
  touch-action: manipulation;
  transition: color 0.2s, background 0.2s;
}
.dock-item:active, .dock-item.active { color: var(--text-main); background: rgba(255,255,255,0.08); }
.dock-item svg { width: 16px; height: 16px; fill: currentColor; }

@media (max-width: 480px) {
  .dock-item span { display: none; }
  .dock-item { padding: 10px 14px; }
}

/* Waterfront motion system */
:root{--ease-water:cubic-bezier(.2,.75,.25,1)}
body{background:radial-gradient(ellipse at 15% 15%,rgba(24,126,133,.28),transparent 42%),linear-gradient(145deg,#061d25,#092f3b 58%,#071f2a)}
#bg-overlay{background:linear-gradient(145deg,rgba(3,30,39,.16),rgba(3,27,37,.08))}
.brand,.home-title{ text-shadow:0 8px 35px rgba(0,0,0,.22)}
.home-subtitle{transition:opacity .26s ease,transform .26s var(--ease-water);min-height:20px}
.home-subtitle.splash-out{opacity:0;transform:translateY(7px)}
.view-panel.active{animation:view-rise .48s var(--ease-water) both}
@keyframes view-rise{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.catalog-card{position:relative;isolation:isolate;animation:card-arrive .55s var(--ease-water) both}
.catalog-card:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 10% 0%,rgba(93,224,207,.18),transparent 65%);transition:opacity .3s ease}
.catalog-card:hover:before{opacity:1}
.catalog-icon{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));border-color:rgba(170,235,225,.18)}
.catalog-icon img{width:29px;height:29px;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.18))}
.catalog-arrow svg{width:17px;height:17px}
@keyframes card-arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.search-container,.engine-btn,.catalog-search,.catalog-category,.setting-row select,.setting-row input{transition:border-color .25s,box-shadow .25s,background .25s,transform .25s}
.search-container:focus-within{border-color:rgba(105,224,211,.55);box-shadow:0 18px 48px rgba(0,0,0,.35),0 0 0 4px rgba(67,198,189,.1)}
#right-sidebar{background:rgba(5,44,53,.82);border-color:rgba(157,226,224,.25)}
#main-view{background:#061d25;animation:browser-enter .35s var(--ease-water) both}
@keyframes browser-enter{from{opacity:.7}to{opacity:1}}
.sidebar-btn{background:rgba(67,198,189,.13);border:1px solid rgba(157,226,224,.18);transition:transform .2s,background .2s}
.sidebar-btn:hover{transform:scale(1.06);background:rgba(67,198,189,.25)}
#url-toolbar{background:rgba(5,39,49,.9);border-color:rgba(157,226,224,.25)}
#url-toolbar.collapsed{visibility:hidden}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #78ded2;outline-offset:3px}
@media(max-width:680px){
 #app{padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(74px + env(safe-area-inset-bottom,0px))}
 header{margin-bottom:20px}
 .view-panel{inset:58px 8px calc(76px + env(safe-area-inset-bottom,0px)) 8px;padding:13px;border-radius:18px}
 .home-title{font-size:clamp(32px,9vw,42px)}
 .home-hero{margin-bottom:24px}
 #main-view{padding-top:env(safe-area-inset-top,0px)}
 #right-sidebar{top:calc(8px + env(safe-area-inset-top,0px));right:8px}
 #url-toolbar{bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 20px)}
 .url-display{max-width:32vw}

}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Remastered browser chrome */
#main-view{isolation:isolate}
#browser-tabs{position:absolute;z-index:40;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(5,28,36,.88);border-bottom:1px solid rgba(157,226,224,.14);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
#tab-strip{display:flex;align-items:center;gap:6px;min-width:0;flex:1;height:100%;overflow-x:auto;scrollbar-width:none}
#tab-strip::-webkit-scrollbar{display:none}
.browser-tab{position:relative;display:flex;align-items:center;gap:9px;min-width:125px;max-width:225px;height:38px;padding:0 11px;border:1px solid transparent;border-radius:11px;background:rgba(255,255,255,.045);color:var(--text-muted);font-size:12px;cursor:grab;user-select:none;transition:background .2s,border-color .2s,transform .2s;flex:0 1 190px}
.browser-tab.active{background:rgba(67,198,189,.16);border-color:rgba(110,221,210,.3);color:var(--text-main)}
.browser-tab.dragging{opacity:.4;transform:scale(.96)}
.browser-tab .tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.browser-tab .tab-close{border:0;background:none;color:inherit;opacity:.6;font-size:16px;line-height:1;cursor:pointer;padding:2px 3px}
.browser-tab .tab-close:hover{opacity:1;color:#ff9a9a}
.chrome-icon-btn{width:37px;height:37px;flex:0 0 37px;border:1px solid transparent;border-radius:11px;background:transparent;color:#d9efec;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.chrome-icon-btn svg{width:19px;height:19px}
.chrome-icon-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(157,226,224,.18)}
.chrome-icon-btn:active{transform:scale(.92)}
#new-tab{background:rgba(255,255,255,.055);border-color:rgba(157,226,224,.14)}
#browser-frame{position:absolute;inset:54px 0 0;width:100%;height:calc(100% - 54px)}

const DOC_ENGINE=(()=>{
 const base=new URL("./",window.location.href),wisp="wss://wisp.mercurywork.shop/";
 const paths={sw:new URL("sw.js",base).href,runtime:new URL("scramjet.js",base).href,wasm:new URL("scramjet.wasm",base).href,utils:new URL("scramjet-utils.js",base).href,api:new URL("controller.api.js",base).href,inject:new URL("controller.inject.js",base).href,transport:"https://cdn.jsdelivr.net/gh/theexpie/Splooshi@343bcb5c839963d01ed3addb1487410876943756/libcurl-client.js"};
 let controller=null,utils=null,frame=null,starting=null;
 const log=m=>{const box=document.getElementById("console-logs");if(box){const line=document.createElement("div");line.textContent="> "+m;box.appendChild(line);box.scrollTop=box.scrollHeight;}console.info("[Doc]",m)};
 const load=src=>new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error("Failed to load "+src));document.head.appendChild(s)});
 async function init(){
  if(controller)return controller;if(starting)return starting;
  starting=(async()=>{
   if(!("serviceWorker"in navigator)||!window.isSecureContext)throw new Error("Scramjet needs HTTPS and service-worker support. Open Doc from GitHub Pages.");
   log("Registering Scramjet service worker…");
   await navigator.serviceWorker.register(paths.sw,{scope:base.pathname,updateViaCache:"none"});
   const registration=await navigator.serviceWorker.ready;
   if(!navigator.serviceWorker.controller){
    log("Waiting for service worker control…");
    await Promise.race([new Promise(resolve=>navigator.serviceWorker.addEventListener("controllerchange",resolve,{once:true})),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Service worker is active but does not control this tab yet. Reload Doc once and retry.")),12000))]);
   }
   const sw=navigator.serviceWorker.controller;if(!sw||!registration.active)throw new Error("Scramjet service worker is not controlling this tab.");
   log("Loading Scramjet runtime and Wisp transport…");
   await load(paths.runtime);await load(paths.api);await load(paths.utils);await load(paths.transport);
   const api=window.$scramjetController;utils=window.$scramjetUtils;
   if(!api?.Controller)throw new Error("Scramjet controller API did not load.");
   if(!utils?.HttpCachePlugin||!utils?.UrlWatcherPlugin||!utils?.CatchEscapedLinksPlugin)throw new Error("Scramjet utility plugins did not load.");
   if(!window.LibcurlTransport?.LibcurlClient)throw new Error("Wisp transport client did not load.");
   api.config.injectPath=paths.inject;api.config.wasmPath=paths.wasm;api.config.scramjetPath=paths.runtime;api.config.prefix=new URL("./~/sj/",base).pathname;
   const transport=new window.LibcurlTransport.LibcurlClient({wisp,websocket:wisp});
   controller=new api.Controller({serviceworker:sw,transport});
   await Promise.race([controller.wait(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Scramjet handshake timed out. Check the Wisp endpoint and service worker.")),18000))]);
   log("Scramjet is ready.");return controller;
  })().catch(e=>{starting=null;log("ENGINE ERROR: "+(e?.message||e));throw e});
  return starting;
 }
 function attach(iframe){
  if(frame)return frame;if(!controller)throw new Error("Scramjet is not ready.");
  const plugins=[new utils.HttpCachePlugin(),new utils.UrlWatcherPlugin(url=>{if(/^https?:\/\//i.test(String(url||""))){urlDisplay.value=url;document.getElementById("active-tab-title").textContent=(new URL(url)).hostname.replace(/^www\./,"")}}),new utils.CatchEscapedLinksPlugin(url=>{const target=new URL(window.location.href);target.search="";target.searchParams.set("url",url.href);return target})];
  frame=controller.createFrame(iframe,{plugins});return frame;
 }
 async function go(iframe,url){await init();return attach(iframe).go(url)}
 function back(iframe){if(frame?.back)return frame.back();try{iframe.contentWindow.history.back()}catch{}}
 function forward(iframe){if(frame?.forward)return frame.forward();try{iframe.contentWindow.history.forward()}catch{}}
 function reload(iframe){if(frame?.reload)return frame.reload();try{iframe.contentWindow.location.reload()}catch{}}
 return {init,go,back,forward,reload,get ready(){return !!controller}};
})();

  setTimeout(()=>{splashNode.textContent=SPLASHES[splashIndex++ % SPLASHES.length];splashNode.classList.remove("splash-out");},260);
}
rotateSplash();setInterval(rotateSplash,4200);
document.getElementById("splash-text").textContent = "";

/* Your Uploaded Photos as Local Canvas-Rendered Blobs / Direct References */
const PHOTOS = [
  "doc image.jpg",   /*[cite: 7] */
  "doc image2.jpg",  /*[cite: 6] */
  "doc image3.jpg",  /*[cite: 5] */
  "doc image4.jpg",  /*[cite: 4] */
  "doc image5.jpg",  /*[cite: 3] */
  "doc image6.jpg",  /*[cite: 2] */
  "doc image7.jpg"   /*[cite: 1] */
];

let pIdx = 0;
const s1 = document.getElementById('slide1'), s2 = document.getElementById('slide2');
s1.style.backgroundImage = `url('${PHOTOS[0]}')`;
s2.style.backgroundImage = `url('${PHOTOS[1]}')`;
setInterval(() => {
  pIdx = (pIdx + 1) % PHOTOS.length;
  const active = s1.classList.contains('active') ? s1 : s2;
  const next = active === s1 ? s2 : s1;
  next.style.backgroundImage = `url('${PHOTOS[pIdx]}')`;
  active.classList.remove('active');
  next.classList.add('active');
}, 8000);

const ICON_SLUGS={"youtube.com":"youtube","discord.com":"discord","spotify.com":"spotify","twitch.tv":"twitch","reddit.com":"reddit","github.com":"github","drive.google.com":"googledrive","classroom.google.com":"googleclassroom","canva.com":"canva","chatgpt.com":"openai","mail.google.com":"gmail","wikipedia.org":"wikipedia","roblox.com":"roblox","krunker.io":"krunker","1v1.lol":"1v1dotlol","shellshock.io":"egghead","tetr.io":"tetris","chess.com":"chessdotcom","poki.com":"poki","crazygames.com":"crazygames","itch.io":"itchdotio","agar.io":"agar","geoguessr.com":"geoguessr","play2048.co":"2048"};
/* Grids */
function populateGrid(containerId,list,filterId,categoryId){
 const grid=document.getElementById(containerId),search=document.getElementById(filterId),category=document.getElementById(categoryId);
 [...new Set(list.map(x=>x.category))].sort().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;category.appendChild(o)});
 function render(){
  const q=search.value.trim().toLowerCase(),cat=category.value;
  const filtered=list.filter(x=>(cat==="all"||x.category===cat)&&[x.name,x.desc,x.category].join(" ").toLowerCase().includes(q));
  grid.innerHTML=filtered.length?filtered.map(x=>{const slug=ICON_SLUGS[x.icon]||"";const src=slug?"https://cdn.simpleicons.org/"+slug:"https://icons.duckduckgo.com/ip3/"+x.icon+".ico";return `<button class="card catalog-card" type="button" data-url="${x.url}" aria-label="Open ${x.name}"><span class="catalog-icon"><img src="${src}" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://icons.duckduckgo.com/ip3/${x.icon}.ico'"></span><span class="catalog-copy"><span class="catalog-name">${x.name}</span><span class="catalog-desc">${x.desc}</span><span class="catalog-tag">${x.category}</span></span><span class="catalog-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M7 7h10v10"/></svg></span></button>`}).join(""):'<div class="catalog-empty">Nothing here. Try another search or category.</div>';
 }
 search.addEventListener("input",render);category.addEventListener("change",render);
 grid.addEventListener("click",e=>{const card=e.target.closest("[data-url]");if(card)launchBrowser(card.dataset.url)});
 render();
}
populateGrid("apps-grid",APPS,"apps-filter","apps-category");
populateGrid("games-grid",GAMES,"games-filter","games-category");

/* Navigation Views */

/* Tab Cloak: changes the browser-tab title and favicon together. */
const TAB_CLOAKS = {
  none: { title: "Doc", icon: null },
  clever: { title: "Clever Portal", icon: "https://www.google.com/s2/favicons?domain=clever.com&sz=64" },
  canvas: { title: "Dashboard", icon: "https://www.google.com/s2/favicons?domain=canvas.instructure.com&sz=64" },
  classroom: { title: "Home - Classroom", icon: "./google-classroom-cloak.svg" },
  youtube: { title: "YouTube", icon: "https://www.google.com/s2/favicons?domain=youtube.com&sz=64" },
  drive: { title: "Home - Google Drive", icon: "./google-drive-cloak.svg" }
};
const cloakSelect = document.getElementById("setting-cloak");
const cloakIcon = document.getElementById("tab-cloak-icon");
function applyTabCloak(value) {
  const cloak = TAB_CLOAKS[value] || TAB_CLOAKS.none;
  document.title = cloak.title;
  if (cloak.icon) cloakIcon.href = cloak.icon;
  else cloakIcon.href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230088a8'/%3E%3Ctext x='32' y='44' font-size='42' text-anchor='middle' fill='white' font-family='Arial'%3ED%3C/text%3E%3C/svg%3E";
  try { localStorage.setItem("doc-tab-cloak", value); } catch (e) {}
}
try {
  const savedCloak = localStorage.getItem("doc-tab-cloak");
  if (savedCloak && TAB_CLOAKS[savedCloak]) cloakSelect.value = savedCloak;
} catch (e) {}
applyTabCloak(cloakSelect.value);
cloakSelect.addEventListener("change", () => applyTabCloak(cloakSelect.value));

/* Pro Browsing Session via Scramjet */
const mainView = document.getElementById('main-view');
const browserFrame = document.getElementById('browser-frame');
const urlDisplay = document.getElementById('current-url-display');

const homeDock = document.getElementById('dock');
const dockEdgeTrigger = document.getElementById('dock-edge-trigger');
function syncBrowsingChrome() {
  const browsing = mainView.classList.contains('active');
  document.body.classList.toggle('browsing', browsing);
  if (homeDock) homeDock.style.setProperty('display', browsing ? 'none' : 'flex', 'important');
  if (dockEdgeTrigger) dockEdgeTrigger.style.setProperty('display', browsing ? 'none' : 'block', 'important');
}
new MutationObserver(syncBrowsingChrome).observe(mainView, { attributes: true, attributeFilter: ['class'] });
syncBrowsingChrome();

async function launchBrowser(url) {
  mainView.classList.add('active');
  syncBrowsingChrome();
  let target=/^https?:\/\//i.test(url)?url:'https://'+url;
  urlDisplay.value=target;
  const title=new URL(target).hostname.replace(/^www\./,"");
  if(!activeBrowserTab)createBrowserTab();
  const tab=browserTabs.find(t=>t.id===activeBrowserTab);if(tab){tab.url=target;tab.title=title;renderBrowserTabs()}
  document.getElementById('active-tab-title').textContent=title;
  addHistory(target,title);
  try{await DOC_ENGINE.go(browserFrame,target)}
  catch(e){const box=document.getElementById("console-logs");if(box){const line=document.createElement("div");line.style.color="#fb7185";line.textContent="> "+(e?.message||e);box.appendChild(line)}urlDisplay.value="Proxy error — open DevTools for details";}
}

document.getElementById('search-bar').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    let val = e.target.value.trim();
    if (!val) return;
    let targetUrl = /^https?:\/\//i.test(val) ? val : (val.includes('.') ? 'https://' + val : engines[currentEngine].url.replace('%s', encodeURIComponent(val)));
    launchBrowser(targetUrl);
  }
});

document.getElementById('btn-return').addEventListener('click', () => { mainView.classList.remove('active'); syncBrowsingChrome(); document.getElementById("url-toolbar").classList.remove("collapsed"); toolbarCollapsed=false; document.getElementById("tb-collapse").disabled=false; });

document.getElementById('tb-back').addEventListener('click',()=>DOC_ENGINE.back(browserFrame));
document.getElementById('tb-forward').addEventListener('click',()=>DOC_ENGINE.forward(browserFrame));
document.getElementById('tb-refresh').addEventListener('click',()=>DOC_ENGINE.reload(browserFrame));
DOC_ENGINE.init().catch(()=>{});
/* Sidebar Panels */
const panels = {
  devtools: document.getElementById('panel-devtools'),
  bookmarks: document.getElementById('panel-bookmarks'),
  history: document.getElementById('panel-history')
};
document.getElementById('btn-devtools').addEventListener('click',()=>openBrowserPanel('devtools'));
document.getElementById('btn-bookmarks').addEventListener('click',()=>openBrowserPanel('bookmarks'));
document.querySelectorAll('.panel-close').forEach(btn=>btn.addEventListener('click',()=>panels[btn.dataset.close]?.classList.remove('open')));

let toolbarCollapsed = false;

/* Browser workspace: multi-tab state, persistent history, movable utility panels. */
const browserTabs=[];
let activeBrowserTab=null;
let tabSequence=0;
const historyStore=(()=>{try{return JSON.parse(localStorage.getItem("doc-history")||"[]")}catch{return []}})();
const bookmarkStore=[
 {title:"YouTube",url:"https://www.youtube.com"},
 {title:"Discord",url:"https://discord.com/app"},
 {title:"GitHub",url:"https://github.com"}
];
const tabStrip=document.getElementById("tab-strip");
const browserChrome=document.getElementById("browser-chrome");
const chromeReveal=document.getElementById("chrome-reveal");
function tabTitle(url){try{return new URL(url).hostname.replace(/^www\./,"")}catch{return "New tab"}}
function persistHistory(){try{localStorage.setItem("doc-history",JSON.stringify(historyStore.slice(0,100)))}catch{}}
function renderBrowserTabs(){
 tabStrip.innerHTML="";
 browserTabs.forEach((tab,index)=>{
  const el=document.createElement("div");el.className="browser-tab"+(tab.id===activeBrowserTab?" active":"");el.draggable=true;el.dataset.tabId=tab.id;
  const title=document.createElement("span");title.className="tab-title";title.textContent=tab.title||"New tab";
  const close=document.createElement("button");close.className="tab-close";close.type="button";close.setAttribute("aria-label","Close tab");close.textContent="×";
  close.addEventListener("click",e=>{e.stopPropagation();closeBrowserTab(tab.id)});
  el.append(title,close);el.addEventListener("click",()=>switchBrowserTab(tab.id));
  el.addEventListener("dragstart",e=>{el.classList.add("dragging");e.dataTransfer.setData("text/plain",tab.id);e.dataTransfer.effectAllowed="move"});
  el.addEventListener("dragend",()=>el.classList.remove("dragging"));
  el.addEventListener("dragover",e=>e.preventDefault());
  el.addEventListener("drop",e=>{e.preventDefault();const from=e.dataTransfer.getData("text/plain"),to=tab.id;if(from&&from!==to){const a=browserTabs.findIndex(t=>t.id===from),b=browserTabs.findIndex(t=>t.id===to);const moved=browserTabs.splice(a,1)[0];browserTabs.splice(b,0,moved);renderBrowserTabs()}});
  tabStrip.appendChild(el);
 });
}
function createBrowserTab(url=""){
 const tab={id:"tab-"+(++tabSequence),url,title:url?tabTitle(url):"New tab"};browserTabs.push(tab);activeBrowserTab=tab.id;renderBrowserTabs();if(url)navigateBrowserTab(tab,url);return tab;
}
function switchBrowserTab(id){
 const tab=browserTabs.find(t=>t.id===id);if(!tab)return;activeBrowserTab=id;
 if(tab.url){urlDisplay.textContent=tab.url;document.getElementById("active-tab-title").textContent=tab.title;try{DOC_ENGINE.go(browserFrame,tab.url).catch(e=>console.warn(e))}catch(e){}}
 else{browserFrame.src="about:blank";urlDisplay.value=""}
 renderBrowserTabs();
}
function closeBrowserTab(id){
 const i=browserTabs.findIndex(t=>t.id===id);if(i<0)return;browserTabs.splice(i,1);
 if(!browserTabs.length){createBrowserTab();return}
 if(activeBrowserTab===id){const next=browserTabs[Math.max(0,i-1)];switchBrowserTab(next.id)}else renderBrowserTabs();
}
function addHistory(url,title){if(!url)return;historyStore.unshift({url,title:title||tabTitle(url),time:Date.now()});historyStore.splice(100);persistHistory();renderHistory()}
function renderHistory(){
 const list=document.getElementById("history-list");if(!list)return;
 list.innerHTML=historyStore.length?historyStore.map((item,i)=>'<div class="history-entry" data-history-index="'+i+'"><span><strong></strong><small></small></span><small>'+new Date(item.time).toLocaleString()+'</small></div>').join(""):'<div class="history-empty">Pages you visit will show up here.</div>';
 list.querySelectorAll("[data-history-index]").forEach(el=>{const item=historyStore[Number(el.dataset.historyIndex)];el.querySelector("strong").textContent=item.title;el.querySelector("span small").textContent=item.url;el.addEventListener("click",()=>launchBrowser(item.url))});
}
function renderBookmarks(){
 const list=document.getElementById("bookmarks-list");if(!list)return;
 list.innerHTML=bookmarkStore.map((item,i)=>'<div class="bookmark-entry" data-bookmark-index="'+i+'"><span><strong></strong><small></small></span><span aria-hidden="true">↗</span></div>').join("");
 list.querySelectorAll("[data-bookmark-index]").forEach(el=>{const item=bookmarkStore[Number(el.dataset.bookmarkIndex)];el.querySelector("strong").textContent=item.title;el.querySelector("small").textContent=item.url;el.addEventListener("click",()=>launchBrowser(item.url))});
}
function openBrowserPanel(name){
 Object.entries(panels).forEach(([key,panel])=>panel.classList.toggle("open",key===name&&!panel.classList.contains("open")));
 document.getElementById("browser-menu-popover").classList.remove("open");
}
document.getElementById("browser-menu").addEventListener("click",e=>{e.stopPropagation();document.getElementById("browser-menu-popover").classList.toggle("open")});
document.getElementById("browser-menu-popover").addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>document.getElementById("browser-menu-popover")?.classList.remove("open"));
document.getElementById("btn-history").addEventListener("click",()=>openBrowserPanel("history"));
document.getElementById("new-tab").addEventListener("click",()=>createBrowserTab());
document.getElementById("current-url-display").addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;const raw=e.currentTarget.value.trim();if(!raw)return;
 const target=/^https?:\\/\\//i.test(raw)?raw:(raw.includes(".")?"https://"+raw:engines[currentEngine].url.replace("%s",encodeURIComponent(raw)));
 launchBrowser(target);e.currentTarget.blur();
});
document.getElementById("tb-collapse").addEventListener("click",()=>{browserChrome.classList.add("collapsed");chromeReveal.classList.add("visible")});
chromeReveal.addEventListener("click",()=>{browserChrome.classList.remove("collapsed");chromeReveal.classList.remove("visible")});
document.getElementById("btn-return").addEventListener("click",()=>{document.body.classList.remove("browsing");mainView.classList.remove("active");browserChrome.classList.remove("collapsed");chromeReveal.classList.remove("visible");document.getElementById("url-toolbar")?.classList.remove("collapsed");toolbarCollapsed=false;document.getElementById("tb-collapse").disabled=false;});
function makePanelMovable(panel){
 const handle=panel.querySelector(".drag-handle");if(!handle)return;let drag=null;
 handle.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;const r=panel.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};handle.setPointerCapture(e.pointerId)});
 handle.addEventListener("pointermove",e=>{if(!drag)return;const x=Math.max(0,Math.min(innerWidth-panel.offsetWidth,e.clientX-drag.x));const y=Math.max(0,Math.min(innerHeight-panel.offsetHeight,e.clientY-drag.y));panel.style.left=x+"px";panel.style.top=y+"px";panel.style.right="auto"});
 const stop=()=>drag=null;handle.addEventListener("pointerup",stop);handle.addEventListener("pointercancel",stop);
}
Object.values(panels).forEach(makePanelMovable);
renderBookmarks();renderHistory();
createBrowserTab();

/* Dock visibility is synchronized to the actual browser-view state above. */
</script>
